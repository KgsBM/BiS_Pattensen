<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Selbstgesteuertes Lernen – KGS Bad Münder, 5. Jahrgang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --navy-900:#06142b; --navy-800:#0a1f3f; --navy-700:#0e2a52; --navy-600:#14386b;
    --sea:#7dd3fc; --sky:#38bdf8; --gold:#fbbf24; --amber:#f59e0b; --sand:#f3dfa5;
  }
  html,body{height:100%;margin:0;}
  body{
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%, #14498c 0%, #0a1f3f 48%, #06142b 100%);
    color:#fff; font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }

  /* ---------- Titel (dauerhaft sichtbar) ---------- */
  #site-header{position:relative;z-index:30;text-align:center;padding:16px 20px 12px;
    border-bottom:2px solid rgba(251,191,36,.55);
    background:linear-gradient(to bottom, rgba(6,20,43,.85), rgba(6,20,43,.35));}
  #site-header h1{margin:0;font-weight:800;letter-spacing:.2px;line-height:1.2;
    font-size:clamp(1.15rem,2.5vw,2.1rem);color:var(--sand);}
  #site-header h1 i{color:var(--gold);margin:0 .6em;}

  /* ---------- Bühne ---------- */
  #main{position:relative;flex:1;min-height:0;z-index:10;}
  #stage{position:absolute;width:1100px;height:524px;transform-origin:0 0;}
  #edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  .edge{fill:none;stroke:var(--sea);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .7s ease;}
  .edge.show{opacity:.95;}

  /* Alle Knoten: identische feste Größe, nie Layoutänderung bei Hover/Touch */
  .node{
    position:absolute;box-sizing:border-box;width:240px;height:124px;padding:0;margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    white-space:nowrap;hyphens:none;-webkit-hyphens:none;overflow:hidden;
    background:var(--navy-700);color:#fff;font:inherit;cursor:pointer;
    border:3px solid var(--sky);border-radius:18px;
    box-shadow:0 10px 22px rgba(0,0,0,.4);
    opacity:0;visibility:hidden;
    transition:opacity .7s ease, background-color .2s ease, border-color .2s ease, color .2s ease;
  }
  .node.show{opacity:1;visibility:visible;}
  .node .ico{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--sea);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);
    transition:color .2s ease, border-color .2s ease;}
  .node .lbl{font-weight:700;font-size:1.2rem;line-height:1.1;}
  .node .hint{font-size:.78rem;color:var(--sea);margin-top:-2px;transition:color .2s ease;}
  .node.opened{border-color:var(--gold);}
  .node:hover,.node:active,.node:focus-visible{
    background:var(--sand);border-color:var(--amber);color:var(--navy-800);outline:none;}
  .node:hover .ico,.node:active .ico,.node:focus-visible .ico{color:var(--navy-800);border-color:var(--navy-800);}
  .node:hover .hint,.node:active .hint{color:var(--navy-600);}
  #n-start.pulse{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 10px 22px rgba(0,0,0,.4),0 0 0 0 rgba(251,191,36,.0);}
                   50%{box-shadow:0 10px 22px rgba(0,0,0,.4),0 0 0 12px rgba(251,191,36,.25);}}

  #reset{position:absolute;right:14px;top:10px;z-index:15;opacity:0;visibility:hidden;
    transition:opacity .4s ease;background:rgba(10,31,63,.7);color:var(--sea);
    border:1.5px solid rgba(125,211,252,.55);border-radius:999px;padding:8px 16px;font:inherit;font-size:.9rem;cursor:pointer;}
  #reset.show{opacity:.9;visibility:visible;}
  #reset:hover{background:var(--sand);color:var(--navy-800);border-color:var(--amber);}

  /* ---------- Wellen ---------- */
  #waves{position:fixed;left:0;right:0;bottom:0;height:130px;z-index:1;pointer-events:none;overflow:hidden;}
  #waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;}
  #waves .w1{animation:wave 22s linear infinite;}
  #waves .w2{animation:wave 15s linear infinite reverse;bottom:-8px;}
  #waves .w3{animation:wave 10s linear infinite;bottom:-18px;}
  @keyframes wave{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s ease;}
  .overlay.open{opacity:1;visibility:visible;}
  #modal{z-index:40;background:rgba(3,10,25,.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:2vh 2vw;}
  .modal-card{width:min(1150px,96vw);max-height:94vh;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#0d2a52 0%,#08172f 100%);
    border:2px solid var(--gold);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 22px;border-bottom:1px solid rgba(251,191,36,.35);}
  .modal-head h2{display:flex;align-items:center;gap:14px;margin:0;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;color:var(--sand);}
  .modal-head .mico{width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;}
  .xbtn{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--sea);background:var(--navy-700);
    color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background-color .2s ease,border-color .2s ease,color .2s ease;}
  .xbtn:hover,.xbtn:active,.xbtn:focus-visible{background:var(--sand);border-color:var(--amber);color:var(--navy-800);outline:none;}
  .modal-body{padding:22px;overflow-y:auto;}
  #grid{display:grid;gap:20px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));}
  @media (max-width:760px){#grid{grid-template-columns:1fr;}}

  .tile{position:relative;height:min(56vh,420px);border-radius:14px;overflow:hidden;cursor:pointer;
    background:#0b1f3c;border:2px solid rgba(125,211,252,.5);padding:0;color:inherit;font:inherit;text-align:left;
    transition:border-color .2s ease, background-color .2s ease;}
  .tile:hover,.tile:active,.tile:focus-visible{border-color:var(--gold);background:#12315e;outline:none;}
  .tile .tx{position:absolute;inset:0;padding:22px 22px 0;font-size:1.05rem;line-height:1.55;color:#dbeafe;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 100%);mask-image:linear-gradient(to bottom,#000 45%,transparent 100%);}
  .tile .tx p{margin:0 0 .8em;}
  .tile .badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;
    background:var(--gold);color:var(--navy-900);font-weight:700;font-size:.9rem;padding:7px 16px;border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff;}
  .tile.contain img{object-fit:contain;object-position:center;background:#f3f4f8;}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:30px 16px 12px;background:linear-gradient(to top,rgba(6,20,43,.95),rgba(6,20,43,0));font-weight:700;font-size:1.05rem;color:#fff;}
  .tile .cap i{color:var(--gold);}

  /* ---------- Lightbox ---------- */
  #lightbox{z-index:60;background:rgba(0,0,0,.94);padding:4vh 3vw;}
  #lightbox .xbtn{position:absolute;top:16px;right:16px;width:60px;height:60px;font-size:26px;z-index:2;}
  #lb-text{display:none;box-sizing:border-box;max-height:92vh;overflow-y:auto;
    background:var(--navy-800);border:2px solid var(--gold);border-radius:20px;padding:clamp(20px,3vw,40px);
    line-height:1.5;color:#f1f5f9;user-select:text;-webkit-user-select:text;column-gap:48px;column-rule:1px solid rgba(251,191,36,.3);hyphens:none;}
  #lb-text h3{margin:0 0 .6em;padding-right:70px;color:var(--sand);font-size:1.3em;column-span:all;}
  #lb-text p{margin:0 0 .85em;break-inside:avoid-column;}
  #lb-fig{display:none;flex-direction:column;align-items:center;gap:10px;max-width:100%;max-height:100%;}
  #lb-img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  #lb-cap{color:var(--sand);font-size:1.15rem;font-weight:600;}

  @media (prefers-reduced-motion:reduce){
    #waves svg,#n-start.pulse{animation:none;}
    .edge,.node{transition:none;}
  }

  /* ---------- Maritime Deko (rein dekorativ, nicht klickbar) ---------- */
  .decor{position:fixed;pointer-events:none;}
  #stars{inset:0 0 55% 0;z-index:0;
    background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fde68a 0 1px,transparent 1.5px);
    background-size:230px 170px,310px 210px;background-position:20px 30px,140px 90px;opacity:.35;animation:twinkle 6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.45}}
  #rose{left:50%;top:52%;width:min(80vh,80vw);height:min(80vh,80vw);margin:calc(min(80vh,80vw) / -2) 0 0 calc(min(80vh,80vw) / -2);z-index:0;opacity:.09;animation:spin 180s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #wheel{left:-70px;top:70px;width:230px;height:230px;z-index:0;opacity:.16;animation:spin 90s linear infinite;}
  #anchor-deco{right:-20px;top:60px;width:200px;height:240px;z-index:0;opacity:.12;transform:rotate(14deg);}
  #lighthouse{right:2vw;bottom:62px;width:110px;height:250px;z-index:0;opacity:.8;}
  #lighthouse .beam{transform-origin:55px 40px;animation:beam 6s ease-in-out infinite;}
  @keyframes beam{0%,100%{opacity:.15}50%{opacity:.55}}
  #boat{left:0;bottom:46px;width:120px;height:120px;z-index:2;animation:sail 75s linear infinite;}
  #boat svg{width:100%;height:100%;animation:bob 4s ease-in-out infinite;transform-origin:50% 90%;}
  @keyframes sail{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 40px))}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
  .gull{z-index:1;width:46px;height:24px;left:0;animation:fly linear infinite;}
  .gull svg{width:100%;height:100%;animation:flap .9s ease-in-out infinite;transform-origin:50% 100%;}
  @keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  .rope{height:7px;border-radius:4px;
    background:repeating-linear-gradient(115deg,#c9a45c 0 6px,#8a6a2c 6px 9px);box-shadow:0 1px 3px rgba(0,0,0,.5);}
  #site-header .rope{position:absolute;left:0;right:0;bottom:-4px;border-radius:0;}
  #site-header{border-bottom:none;}
  .modal-head{border-bottom:none;position:relative;padding-bottom:20px;}
  .modal-head .rope{position:absolute;left:18px;right:18px;bottom:0;}
  #site-header h1 .fa-solid{display:inline-block;}
  @media (prefers-reduced-motion:reduce){#rose,#wheel,#boat,#boat svg,.gull,.gull svg,#stars,#lighthouse .beam{animation:none;}}
</style>
</head>
<body>


<!-- Dekoration -->
<div id="stars" class="decor" aria-hidden="true"></div>
<svg id="rose" class="decor" viewBox="-100 -100 200 200" aria-hidden="true" fill="none" stroke="#fbbf24" stroke-width="1.2">
  <circle r="95"/><circle r="80"/><circle r="52" stroke-dasharray="2 4"/>
  <path d="M0-98L12-12L98 0L12 12L0 98L-12 12L-98 0L-12-12Z" fill="#fbbf24" fill-opacity=".25"/>
  <path d="M0-60L-6-6L-60 0L-6 6L0 60L6 6L60 0L6-6Z" transform="rotate(45)" fill="#fbbf24" fill-opacity=".15"/>
</svg>
<svg id="wheel" class="decor" viewBox="-100 -100 200 200" aria-hidden="true" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round">
  <circle r="58"/><circle r="22" stroke-width="9"/>
  <g stroke-width="8"><path d="M0-22V-92M0 22V92M-22 0H-92M22 0H92M15.5-15.5L65-65M-15.5 15.5L-65 65M15.5 15.5L65 65M-15.5-15.5L-65-65"/></g>
  <g stroke-width="13"><circle cx="0" cy="-92" r="2"/><circle cx="0" cy="92" r="2"/><circle cx="-92" cy="0" r="2"/><circle cx="92" cy="0" r="2"/><circle cx="65" cy="-65" r="2"/><circle cx="-65" cy="65" r="2"/><circle cx="65" cy="65" r="2"/><circle cx="-65" cy="-65" r="2"/></g>
</svg>
<svg id="anchor-deco" class="decor" viewBox="0 0 100 120" aria-hidden="true" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="50" cy="14" r="9"/><path d="M50 23V108M30 40H70M12 76C14 98 32 110 50 110C68 110 86 98 88 76M12 76L4 88M12 76L22 86M88 76L96 88M88 76L78 86"/>
</svg>
<svg id="lighthouse" class="decor" viewBox="0 0 110 250" aria-hidden="true">
  <polygon class="beam" points="55,40 -400,0 -400,80" fill="#fde68a"/>
  <polygon class="beam" points="55,40 510,0 510,80" fill="#fde68a"/>
  <path d="M38 240L46 80H64L72 240Z" fill="#f1f5f9"/>
  <path d="M43 140L45 110H65L67 140Z M40 205L42 175H68L70 205Z" fill="#dc2626"/>
  <rect x="40" y="72" width="30" height="8" rx="2" fill="#334155"/>
  <rect x="45" y="46" width="20" height="26" fill="#fde68a"/><rect x="45" y="46" width="20" height="26" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M42 46L55 28L68 46Z" fill="#dc2626"/><circle cx="55" cy="26" r="3" fill="#334155"/>
</svg>
<div class="decor gull" style="top:14%;animation-duration:38s;animation-delay:-5s" aria-hidden="true"><svg viewBox="0 0 46 24"><path d="M2 20C12 2 20 4 23 14C26 4 34 2 44 20C34 12 28 12 23 20C18 12 12 12 2 20Z" fill="#e2e8f0"/></svg></div>
<div class="decor gull" style="top:24%;animation-duration:52s;animation-delay:-24s;width:34px;height:18px" aria-hidden="true"><svg viewBox="0 0 46 24"><path d="M2 20C12 2 20 4 23 14C26 4 34 2 44 20C34 12 28 12 23 20C18 12 12 12 2 20Z" fill="#cbd5e1"/></svg></div>
<div class="decor gull" style="top:36%;animation-duration:64s;animation-delay:-40s;width:28px;height:15px" aria-hidden="true"><svg viewBox="0 0 46 24"><path d="M2 20C12 2 20 4 23 14C26 4 34 2 44 20C34 12 28 12 23 20C18 12 12 12 2 20Z" fill="#94a3b8"/></svg></div>
<div id="boat" class="decor" aria-hidden="true">
  <svg viewBox="0 0 120 120"><path d="M58 12V84" stroke="#f3dfa5" stroke-width="3"/>
    <path d="M62 14C92 36 98 62 98 80H62Z" fill="#fff"/><path d="M54 22C36 40 28 60 26 80H54Z" fill="#fbbf24"/>
    <path d="M62 14C84 30 92 50 94 64C84 52 72 44 62 40Z" fill="#dc2626"/>
    <path d="M12 86H108L96 104H26Z" fill="#7c2d12"/><path d="M12 86H108" stroke="#fbbf24" stroke-width="3"/>
    <path d="M58 12L74 18L58 24Z" fill="#dc2626"/></svg>
</div>

<header id="site-header">
  <h1><i class="fa-solid fa-anchor"></i>Selbstgesteuertes Lernen an der KGS Bad Münder im 5. Jahrgang<i class="fa-solid fa-ship"></i></h1>
  <div class="rope"></div>
</header>

<main id="main">
  <button id="reset" type="button"><i class="fa-solid fa-rotate-left"></i>&nbsp; Neu starten</button>
  <div id="stage">
    <svg id="edges" viewBox="0 0 1100 524" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
        </marker>
      </defs>
    </svg>
  </div>
</main>

<!-- Animierte Wellen -->
<div id="waves" aria-hidden="true">
  <svg class="w1" viewBox="0 0 2880 130" preserveAspectRatio="none"><path fill="rgba(14,90,140,.45)" d="M0 60 Q180 20 360 60 T720 60 T1080 60 T1440 60 T1800 60 T2160 60 T2520 60 T2880 60 V130 H0Z"/></svg>
  <svg class="w2" viewBox="0 0 2880 130" preserveAspectRatio="none"><path fill="rgba(56,189,248,.28)" d="M0 70 Q180 105 360 70 T720 70 T1080 70 T1440 70 T1800 70 T2160 70 T2520 70 T2880 70 V130 H0Z"/></svg>
  <svg class="w3" viewBox="0 0 2880 130" preserveAspectRatio="none"><path fill="rgba(6,30,70,.8)" d="M0 88 Q180 58 360 88 T720 88 T1080 88 T1440 88 T1800 88 T2160 88 T2520 88 T2880 88 V130 H0Z"/></svg>
</div>

<!-- Detail-Fenster -->
<div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal-card">
    <div class="modal-head">
      <h2><span class="mico"><i id="m-icon" class="fa-solid"></i></span><span id="m-title"></span></h2>
      <button class="xbtn" type="button" id="m-close" aria-label="Schließen"><i class="fa-solid fa-xmark"></i></button>
      <div class="rope"></div>
    </div>
    <div class="modal-body"><div id="grid"></div></div>
  </div>
</div>

<!-- Vollbild-Lightbox -->
<div id="lightbox" class="overlay" role="dialog" aria-modal="true">
  <button class="xbtn" type="button" id="lb-close" aria-label="Schließen"><i class="fa-solid fa-xmark"></i></button>
  <div id="lb-text"></div>
  <figure id="lb-fig" style="margin:0"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>

/* ---------- Stammbaum ---------- */
const STAGE_W = 1100, STAGE_H = 524, NODE_W = 240, NODE_H = 124;
const ROW_Y = [0, 200, 400];
const NODES = {
  start:      { x: 550, row: 0, label: "4 Pfeiler",        icon: "fa-ship",           hint: "antippen" },
  orga:       { x: 275, row: 1, label: "Organisatorisches", icon: "fa-sailboat" },
  unterricht: { x: 825, row: 1, label: "Unterricht",        icon: "fa-life-ring" },
  logbuch:    { x: 140, row: 2, label: "Logbuch",           icon: "fa-book-journal-whills", modal: "logbuch" },
  kompass:    { x: 410, row: 2, label: "Kompassgespräche",  icon: "fa-compass",           modal: "kompass" },
  basiscamp:  { x: 690, row: 2, label: "Basiscamp",         icon: "fa-campground",        modal: "basiscamp" },
  ankerzeit:  { x: 960, row: 2, label: "Ankerzeit",         icon: "fa-anchor",            modal: "ankerzeit" }
};
const CHILDREN = {
  start: ["orga", "unterricht"],
  orga: ["logbuch", "kompass"],
  unterricht: ["basiscamp", "ankerzeit"]
};

const stage = document.getElementById("stage");
const edges = document.getElementById("edges");
const resetBtn = document.getElementById("reset");
const els = {};

for (const [id, n] of Object.entries(NODES)) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "node";
  b.id = "n-" + id;
  b.style.left = (n.x - NODE_W / 2) + "px";
  b.style.top = ROW_Y[n.row] + "px";
  b.innerHTML = '<span class="ico"><i class="fa-solid ' + n.icon + '"></i></span><span class="lbl"></span>' +
                (n.hint ? '<span class="hint"></span>' : "");
  b.querySelector(".lbl").textContent = n.label;
  if (n.hint) b.querySelector(".hint").textContent = n.hint;
  b.addEventListener("click", () => n.modal ? openModal(n.modal) : reveal(id));
  stage.appendChild(b);
  els[id] = b;
}

function drawEdge(from, to) {
  const a = NODES[from], b = NODES[to];
  const x1 = a.x, y1 = ROW_Y[a.row] + NODE_H + 3;
  const x2 = b.x, y2 = ROW_Y[b.row] - 5;
  const dy = (y2 - y1) * 0.55;
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x1} ${y1} C${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`);
  p.setAttribute("class", "edge");
  p.setAttribute("marker-end", "url(#arrow)");
  edges.appendChild(p);
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add("show")));
}

function reveal(id) {
  const el = els[id];
  if (el.classList.contains("opened")) return;
  el.classList.add("opened");
  el.classList.remove("pulse");
  CHILDREN[id].forEach(c => {
    drawEdge(id, c);
    requestAnimationFrame(() => requestAnimationFrame(() => els[c].classList.add("show")));
  });
  resetBtn.classList.add("show");
}

function resetTree() {
  Object.entries(els).forEach(([id, el]) => { el.classList.remove("opened"); if (id !== "start") el.classList.remove("show"); });
  edges.querySelectorAll(".edge").forEach(e => e.remove());
  els.start.classList.add("pulse");
  resetBtn.classList.remove("show");
}
resetBtn.addEventListener("click", resetTree);
els.start.classList.add("show", "pulse");

/* Bühne an Bildschirm anpassen (iPad hoch/quer, Smartboard) */
function fit() {
  const m = document.getElementById("main").getBoundingClientRect();
  const s = Math.min((m.width * 0.97) / STAGE_W, (m.height - 70) / STAGE_H, 1.5);
  stage.style.transform = `scale(${s})`;
  stage.style.left = Math.max(0, (m.width - STAGE_W * s) / 2) + "px";
  stage.style.top = Math.max(8, (m.height - 70 - STAGE_H * s) / 2 + 8) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 250));
fit();

/* ---------- Modal ---------- */
const modal = document.getElementById("modal");
const grid = document.getElementById("grid");
const lightbox = document.getElementById("lightbox");
const lbText = document.getElementById("lb-text");
const lbFig = document.getElementById("lb-fig");
const lbImg = document.getElementById("lb-img");
const lbCap = document.getElementById("lb-cap");

function openModal(key) {
  const d = CONTENT[key];
  document.getElementById("m-title").textContent = d.title;
  document.getElementById("m-icon").className = "fa-solid " + d.icon;
  grid.innerHTML = "";
  grid.style.setProperty("--cols", 1 + d.images.length);

  // Kachel 1: Text-Vorschau mit Ausblendung
  const t = document.createElement("button");
  t.type = "button"; t.className = "tile";
  const tx = document.createElement("div"); tx.className = "tx";
  d.text.forEach(s => { const p = document.createElement("p"); p.textContent = s; tx.appendChild(p); });
  const badge = document.createElement("span"); badge.className = "badge";
  badge.innerHTML = '<i class="fa-solid fa-book-open"></i>&nbsp; Ganzen Text lesen';
  t.append(tx, badge);
  t.addEventListener("click", () => openLightbox({ title: d.title, text: d.text }));
  grid.appendChild(t);

  // Kachel 2 (und 3): Bild-Vorschauen
  d.images.forEach(im => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile" + (im.fit === "contain" ? " contain" : "");
    const img = document.createElement("img"); img.src = im.src; img.alt = im.label;
    const cap = document.createElement("div"); cap.className = "cap";
    const sp = document.createElement("span"); sp.textContent = im.label;
    cap.innerHTML = '<i class="fa-solid fa-expand"></i>'; cap.prepend(sp);
    b.append(img, cap);
    b.addEventListener("click", () => openLightbox({ src: im.src, label: im.label }));
    grid.appendChild(b);
  });

  modal.classList.add("open");
  document.querySelector(".modal-body").scrollTop = 0;
  document.getElementById("m-close").focus({ preventScroll: true });
}
function closeModal() { modal.classList.remove("open"); }

function openLightbox(o) {
  if (o.text) {
    lbFig.style.display = "none";
    lbText.style.display = "block";
    lbText.innerHTML = "";
    const h = document.createElement("h3"); h.textContent = o.title; lbText.appendChild(h);
    o.text.forEach(s => { const p = document.createElement("p"); p.textContent = s; lbText.appendChild(p); });
    lbText.scrollTop = 0;
  } else {
    lbText.style.display = "none";
    lbFig.style.display = "flex";
    lbImg.src = o.src; lbImg.alt = o.label; lbCap.textContent = o.label;
  }
  lightbox.classList.add("open");
  if (o.text) fitLightboxText();
  document.getElementById("lb-close").focus({ preventScroll: true });
}
/* Text so setzen, dass er ohne Scrollen komplett auf den Bildschirm passt */
function fitLightboxText() {
  const box = lbText, vw = window.innerWidth, vh = window.innerHeight;
  const maxH = vh * 0.9;
  const widths = { 1: Math.min(1000, vw * 0.94), 2: Math.min(1500, vw * 0.96), 3: Math.min(1850, vw * 0.97) };
  const allowed = [1]; if (vw >= 900) allowed.push(2); if (vw >= 1400) allowed.push(3);
  box.style.maxHeight = "none"; box.style.overflowY = "hidden";
  const best = {};
  for (const cols of allowed) {
    box.style.width = widths[cols] + "px";
    box.style.columnCount = cols;
    best[cols] = 0;
    for (let s = 32; s >= 14; s--) {
      box.style.fontSize = s + "px";
      if (box.getBoundingClientRect().height <= maxH) { best[cols] = s; break; }
    }
  }
  const top = Math.max(...allowed.map(c => best[c]));
  let pick = allowed.find(c => best[c] >= Math.min(top, 26)) || allowed[allowed.length - 1];
  box.style.width = widths[pick] + "px";
  box.style.columnCount = pick;
  box.style.fontSize = (best[pick] || 14) + "px";
  box.style.maxHeight = "92vh"; box.style.overflowY = "auto"; /* Notanker, falls selbst 14px nicht reichen */
}
window.addEventListener("resize", () => { if (lightbox.classList.contains("open") && lbText.style.display === "block") fitLightboxText(); });

function closeLightbox() { lightbox.classList.remove("open"); }

document.getElementById("m-close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.getElementById("lb-close").addEventListener("click", closeLightbox);
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (lightbox.classList.contains("open")) closeLightbox(); else closeModal();
});
</script>
